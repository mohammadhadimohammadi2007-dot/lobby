# =====================================================================
#  Lobby server - main configuration
#  After editing, run /lobby reload in game (or restart the server).
#  /lobby reload tells you which changes need a full restart.
# =====================================================================

# ---------------- Server ----------------
server:
  # Name of this lobby, shown by %server_name% and %lobby_id%. Letters, digits, - and _ only.
  name: "lobby"
  # The address to listen on. "0.0.0.0" means all network interfaces.
  host: "0.0.0.0"
  # The port players (or your proxy) connect to.
  port: 25565
  # Shown in the server list. Uses MiniMessage colors: https://docs.advntr.dev/minimessage/format
  # and global placeholders like %server_online% (see docs/placeholders.md).
  # Only used in standalone mode (behind a proxy, the proxy shows its own MOTD).
  motd: "<gold><bold>My Network</bold></gold> <gray>- Lobby <dark_gray>(%server_online% online)"
  # Players allowed on this lobby at the same time. New players are refused when it is full.
  max-players: 200

# ---------------- Connection ----------------
# How players reach this server:
#   standalone - players join this server directly, no proxy
#   velocity   - behind a Velocity proxy using modern forwarding (recommended)
#   bungeecord - behind BungeeCord/Waterfall using legacy forwarding
mode: standalone

# Only used when mode is "standalone". Behind a proxy, the proxy decides this.
#   true  - only premium (paid Minecraft) accounts can join
#   false - offline mode: anyone can join with any username, no premium account needed
online-mode: false

# Only used in standalone offline mode. Gives offline players the skin of the premium
# account with the same name (looked up from Mojang). true or false.
fetch-skins-for-offline-players: true

# Must match "forwarding-secret" in Velocity (the text inside Velocity's forwarding.secret file).
# Only used when mode is "velocity".
velocity-secret: ""

# Optional BungeeGuard tokens. Leave empty to disable. Only used when mode is "bungeecord".
# Example: ["my-long-random-token"]
bungeeguard-tokens: []

# ---------------- World ----------------
world:
  # A world folder (the one that contains "level.dat" or "region/") OR a .polar file.
  # Just copy your world folder to worlds/lobby. Build your map between Y 0 and Y 255 so old 1.8
  # clients can see all of it.
  path: "worlds/lobby"
  # Convert a world folder to a .polar file next to it (faster loading, lower memory). The folder is
  # kept, and when you edit it the map is converted again on the next start. true or false.
  convert-anvil-to-polar: true
  # How many chunks around spawn are loaded before players can join (1-32). At least view-distance + 1
  # is always loaded (what a player at spawn is sent), so this only matters when it is larger.
  preload-radius: 6
  # How many chunks players can see around them (2-32).
  view-distance: 8
  # Fixed time of day (0-24000, 6000 = noon). Use -1 for a normal day/night cycle.
  time: 6000
  # Players who fall below this Y are sent back to spawn.
  void-y: 0

# ---------------- Lobby instances ----------------
# One server can run several copies ("instances") of the same map. Players in different instances do
# not see each other, which keeps a busy lobby from feeling crowded. The map is loaded once and shared,
# so extra instances cost almost no memory. Holograms, NPCs, portals and jump pads appear in all of them.
lobbies:
  # How many instances to create: a number from 1 to 50, or "auto".
  #   1      - one lobby, exactly like a normal server (the default)
  #   auto   - one instance per "players-per-instance" of server.max-players
  instances: 1
  # How many players one instance should hold. Used for "auto", for choosing where a joining player
  # goes, and for /lobby <number> (players with "lobby.lobbies.join-full" may still join a full one).
  players-per-instance: 50
  # Which instance a joining player is put in:
  #   least-players - the emptiest one, so the load is spread (the default)
  #   fill-first    - the first one that still has room, so lobby 1 fills up before lobby 2 is used
  join: least-players

# ---------------- NPCs ----------------
npcs:
  # A client only draws a player NPC's skin if the NPC is in its player list (the tab list).
  # Clients 1.19.3 and newer can have entries that never show in the tab list. Older clients cannot:
  # 1.8.9 through ViaRewind often shows Steve if the entry is not listed while the NPC appears, so for
  # those clients the NPC is listed and removed from their tab list again after this many
  # milliseconds (0-30000). Raise it if 1.8 players still see Steve; 0 removes it right away.
  legacy-tab-removal-delay: 3000

# Where players appear when they join or use /spawn. Set it in game with /lobby setspawn.
spawn:
  x: 0.5
  y: 65
  z: 0.5
  yaw: 0
  pitch: 0

# ---------------- Protection ----------------
# true = players CAN do it, false = it is blocked.
# Players with permission "lobby.bypass.protection" ignore all of these.
protection:
  # Breaking blocks.
  block-break: false
  # Placing blocks.
  block-place: false
  # Taking damage (falling, other players...).
  damage: false
  # Losing food. false keeps the food bar full.
  hunger: false
  # Dropping items from the inventory.
  item-drop: false

# ---------------- Operators ----------------
# Only used when LuckPerms is disabled (see integrations.yml).
# Usernames listed here get every permission. Example: ["Notch", "jeb_"]
operators: []
