# =====================================================================
#  Messages - every text players see.
#  Format: MiniMessage, see https://docs.advntr.dev/minimessage/format
#  Words in <angle-brackets> that are listed under a message are filled in by the server.
#  Every message can also use placeholders such as %player_name% or %luckperms_prefix%
#  (full list: docs/placeholders.md). They describe the player who receives the message.
#  Reload with /lobby reload.
# =====================================================================

# Added in front of command replies with <prefix>.
prefix: "<dark_gray>[<gold>Lobby</gold>]</dark_gray> "

no-permission: "<prefix><red>You don't have permission to do that."
players-only: "<prefix><red>Only players can use this command."

# /spawn
spawn-teleported: "<prefix><gray>Welcome back to spawn, <white>%player_name%</white>."

# /lobby
lobby-usage: "<prefix><gray>Usage: <white>/lobby <number></white>, <white>/lobby reload</white>, <white>/lobby setspawn</white> or <white>/lobby info"
# Moving between the lobby instances of this server (see "lobbies" in config.yml).
# <number> = the lobby number, <count> = how many lobbies this server has
lobby-switched: "<prefix><gray>You are now in lobby <white><number></white>."
lobby-already-here: "<prefix><gray>You are already in lobby <white><number></white>."
lobby-unknown: "<prefix><red>There is no lobby <number>. This server has <count>."
lobby-full: "<prefix><red>Lobby <number> is full."
# The lobby selector menu. Only the texts; the items are built by the server.
lobby-selector-title: "<dark_gray>Lobbies"
lobby-selector-name: "<yellow><bold>Lobby <number>"
lobby-selector-players: "<gray><players> player(s)"
lobby-selector-current: "<green>You are here"
lobby-selector-click: "<yellow>Click to join"

# ---------------- Holograms (/hologram, see docs/holograms.md) ----------------
hologram-usage: "<prefix><gray>Usage: <white>/hologram list | near | create <name> | delete <name> | info <name> | addline <name> <text> | set <name> <property> <value> | action add <name> <action> | teleport <name> | goto <name> | copy <name> <new> | import"
# <name> = the hologram's name, <type> = text, item or block
hologram-created: "<prefix><green>Created the <type> hologram <white><name></white> where you are standing."
hologram-exists: "<prefix><red>There is already a hologram called <name>."
hologram-deleted: "<prefix><green>Deleted the hologram <white><name></white>."
hologram-unknown: "<prefix><red>There is no hologram called <name>."
hologram-invalid-name: "<prefix><red>'<name>' cannot be a hologram name. Use letters, digits, - and _ (at most 32)."
# <count> = how many, <names> = their names
hologram-list: "<prefix><gray>Holograms (<white><count></white>): <names>"
hologram-list-empty: "<prefix><gray>No holograms here. Create one with /hologram create <name>."
hologram-info: "<prefix><gray>Hologram <white><name></white> (<type>) at <x>, <y>, <z><newline><gray>Lines: <white><lines></white>, frames: <white><frames></white>, scale: <white><scale></white>, billboard: <white><billboard></white>, alignment: <white><alignment></white><newline><gray>Shown within <white><view-distance></white> blocks, rebuilt every <white><update-interval></white> ticks, visible to <white><permission></white><newline><gray>Click: <white><actions>"
hologram-moved: "<prefix><green>Moved <white><name></white> to where you are standing."
hologram-copied: "<prefix><green>Copied <white><name></white> to <white><new-name></white>."
# <line> = the line number
hologram-line-added: "<prefix><green>Added line <white><line></white> to <white><name></white>."
hologram-line-set: "<prefix><green>Changed line <white><line></white> of <white><name></white>."
hologram-line-removed: "<prefix><green>Removed line <white><line></white> of <white><name></white>."
hologram-no-such-line: "<prefix><red>There is no line <line>; this hologram has <lines>."
hologram-too-many-lines: "<prefix><red>A hologram can have at most <max> lines."
hologram-wrong-type: "<prefix><red><name> is a <type> hologram, so it has no lines."
hologram-needs-material: "<prefix><red>A <type> hologram needs an item or block name, for example /hologram create shop <type> diamond."
# <player> = the player a manual hologram is shown to or hidden from
hologram-shown-to: "<prefix><green><name> is now shown to <white><player></white>."
hologram-hidden-from: "<prefix><green><name> is now hidden from <white><player></white>."
hologram-not-manual: "<prefix><red><name> is in visibility mode <visibility>. Use /hologram set <name> visibility manual first."
# <command> = the command to use instead
hologram-use-line-command: "<prefix><gray>Lines have their own command here: <white><command></white> followed by the text."
# <properties> = every property name
hologram-properties: "<prefix><gray>Properties: <white><properties>"
hologram-property-set: "<prefix><green><name>: <white><property></white> is now <white><value></white>."
hologram-property-invalid: "<prefix><red><property>: <error>. Allowed: <allowed>."
# <action> = one action line, <actions> = all of them, <types> = the action types that exist
hologram-action-added: "<prefix><green>Added the action <white><action></white> to <white><name></white>."
hologram-actions-cleared: "<prefix><green><name> does nothing when clicked any more."
hologram-action-list: "<prefix><gray><name> runs on click: <white><actions>"
hologram-action-invalid: "<prefix><red>That action cannot be read: <error>. Types: <types>."
hologram-imported: "<prefix><green>Imported <white><count></white> hologram(s) from <white><file></white>."
hologram-import-skipped: "<prefix><yellow>Not imported: <entry>"
hologram-import-nothing: "<prefix><yellow>Nothing to import. Put FancyHolograms' holograms.yml in <white><file></white> and try again."
reload-done: "<prefix><green>Configuration reloaded."
# <options> = list of changed options that only apply after a restart
reload-restart-needed: "<prefix><yellow>These changes need a full restart: <white><options>"
# <error> = what went wrong
reload-failed: "<prefix><red>Reload failed, nothing was changed: <error>"
# <warnings> = how many problems were found (details are in the console)
reload-warnings: "<prefix><yellow><warnings> problem(s) found in the config files. See the console for details."
# <x> <y> <z> <yaw> <pitch>
setspawn-done: "<prefix><green>Spawn set to <white><x>, <y>, <z></white> (yaw <yaw>, pitch <pitch>)."
setspawn-failed: "<prefix><red>Could not save the spawn: <error>"

# /lobby info
# <mode> <players> <max-players> <tps> <mspt> <memory-used> <memory-max>
# <world> <world-format> <chunks> <integrations> <bridge>
info: |-
  <gold><bold>Lobby info</bold></gold>
  <gray>Mode: <white><mode>
  <gray>Players: <white><players>/<max-players>
  <gray>TPS: <white><tps></white>  MSPT: <white><mspt>
  <gray>Memory: <white><memory-used> MB / <memory-max> MB
  <gray>World: <white><world></white> (<world-format>, <chunks> chunks)
  <gray>Integrations: <white><integrations>
  <gray>Bridge: <white><bridge>

# Shown when a player cannot join.
kick-server-full: "<red>The lobby is full. Please try again in a moment."
# <reason> <banned-by> <expires>
kick-banned: "<red><bold>You are banned from this server.</bold></red><newline><newline><gray>Reason: <white><reason><newline><gray>Banned by: <white><banned-by><newline><gray>Expires: <white><expires>"
# Shown as <expires> for permanent bans.
ban-never-expires: "Never"

# ---------------- Chat ----------------
# <reason> <expires> (date, or ban-never-expires for permanent mutes)
chat-muted: "<red>You are muted. <gray>Reason: <white><reason></white>, expires: <white><expires>"
chat-muted-command: "<red>You cannot use this command while muted."
# <seconds> = how long to wait
chat-cooldown: "<red>Slow down! You can chat again in <white><seconds>s</white>."
chat-duplicate: "<red>Please do not repeat the same message."
# <max> = longest allowed message
chat-too-long: "<red>Your message is too long (max <max> characters)."
# <seconds> = time left
chat-new-player-wait: "<red>New players can chat in <white><seconds>s</white>."
chat-new-player-move: "<red>Move a little before you start chatting."
chat-slowmode: "<red>Slow mode is on: you can chat again in <white><seconds>s</white>."
chat-locked: "<red>The chat is locked right now."
chat-blocked: "<red>Your message was not sent: it breaks the chat rules."
chat-warning: "<yellow>Please keep the chat friendly. Repeated rule breaking leads to a mute."
chat-link-warning: "<yellow>Advertising other servers or websites is not allowed."
# Reason shown with chat-muted for automatic mutes on this lobby (when there is no bridge).
chat-auto-mute-reason: "breaking the chat rules repeatedly"
# <minutes>
chat-auto-muted: "<red>You were muted for <minutes> minutes for breaking the chat rules repeatedly."
chat-disabled-for-you: "<gray>You have hidden the chat. Type <white>/chat toggle</white> to show it again."

# Staff. <player> <category> <detail> <message>
chat-staff-notify: "<dark_gray>[<red>Filter</red>]</dark_gray> <white><player></white> <gray>(<category>: <detail>):</gray> <message>"
# <player> <reason> <message>
chat-spy: "<dark_gray>[<aqua>Spy</aqua>]</dark_gray> <white><player></white> <gray>blocked (<reason>):</gray> <message>"
# Shown in the name hover for staff. <id>
chat-staff-hover: "<dark_gray>Message id: <id></dark_gray>"
# <player> <minutes>
chat-staff-auto-muted: "<dark_gray>[<red>Filter</red>]</dark_gray> <white><player></white> <gray>was auto-muted for <minutes> minutes."

# Channels. <channel> <channels>
channel-switched: "<prefix><gray>You are now talking in <white><channel></white>."
channel-unknown: "<prefix><red>Unknown channel. Channels: <white><channels>"
channel-no-permission: "<prefix><red>You cannot use the <channel> channel."
ch-usage: "<prefix><gray>Usage: <white>/ch <channel></white>. Channels: <white><channels>"

# /chat
chat-usage: "<prefix><gray>Usage: <white>/chat toggle</white>, <white>/chat persian</white>, <white>/chat mentions</white>"
chat-staff-usage: "<prefix><gray>Staff: <white>/chat clear</white>, <white>/chat lock</white>, <white>/chat delete <id></white>, <white>/chat spy</white>, <white>/slowmode <seconds|off></white>"
chat-hidden: "<prefix><gray>Chat hidden. Type <white>/chat toggle</white> to show it again."
chat-shown: "<prefix><gray>Chat shown again."
persian-on: "<prefix><gray>Persian text fixing is now <green>on</green>."
persian-off: "<prefix><gray>Persian text fixing is now <red>off</red>."
mentions-on: "<prefix><gray>Mention notifications are now <green>on</green>."
mentions-off: "<prefix><gray>Mention notifications are now <red>off</red>."
feature-disabled: "<prefix><red>This feature is turned off on this server."
# <player> = who mentioned you (shown in the action bar)
mention-actionbar: "<yellow><player> mentioned you"

# /ignore. <player> <players>
ignore-added: "<prefix><gray>You no longer see messages from <white><player></white>."
ignore-removed: "<prefix><gray>You see messages from <white><player></white> again."
ignore-self: "<prefix><red>You cannot ignore yourself."
ignore-list: "<prefix><gray>Ignored: <white><players>"
ignore-empty: "<prefix><gray>You are not ignoring anyone."
ignore-usage: "<prefix><gray>Usage: <white>/ignore <player></white> or <white>/ignore list"
# <name>
player-not-found: "<prefix><red>Player <white><name></white> is not online."

# Private messages (only if private-messages-enabled is true in chat.yml). <name> <message>
msg-to: "<gray>[<white>me</white> → <white><name></white>] <white><message>"
msg-from: "<gray>[<white><name></white> → <white>me</white>] <white><message>"
msg-no-reply: "<prefix><red>Nobody to reply to."
msg-usage: "<prefix><gray>Usage: <white>/msg <player> <message>"
msg-ignored: "<prefix><red>That player is ignoring you."

# Staff tools. <staff> <seconds> <id>
chat-cleared: "<prefix><gray>The chat was cleared by <white><staff></white>."
chat-locked-on: "<prefix><red>The chat was locked by <white><staff></white>."
chat-locked-off: "<prefix><green>The chat was unlocked by <white><staff></white>."
slowmode-on: "<prefix><gray>Slow mode: one message every <white><seconds>s</white>."
slowmode-off: "<prefix><gray>Slow mode is off."
slowmode-usage: "<prefix><gray>Usage: <white>/slowmode <seconds|off>"
message-deleted: "<prefix><gray>Message deleted."
message-not-found: "<prefix><red>No recent message with id <white><id></white>."
spy-on: "<prefix><gray>Chat spy <green>on</green>: you see blocked messages."
spy-off: "<prefix><gray>Chat spy <red>off</red>."

# Join and quit (only if enabled in chat.yml). Placeholders are about the player who joined.
join-message: "<dark_gray>[<green>+</green>]</dark_gray> <gray>%player_name%"
quit-message: "<dark_gray>[<red>-</red>]</dark_gray> <gray>%player_name%"

# ---------------- Actions (NPCs, holograms, menus, hotbar items, portals) ----------------
# A "connect" action when the lobby cannot send players to other servers (standalone, no bridge).
connect-not-available: "<prefix><red>Switching servers is not available right now."
# The server, or every server of the group, is full. <server>
connect-full: "<prefix><red><white><server></white> is full right now. Try again in a moment."
# The server did not answer the proxy. <server>
connect-offline: "<prefix><red><white><server></white> is offline right now."
# The proxy has no server or group with that name (a mistake in the config). <server>
connect-unknown: "<prefix><red><white><server></white> does not exist. Please tell an admin."
# Anything else that stopped the move. <server>
connect-failed: "<prefix><red>Could not send you to <white><server></white>. Please try again."
# Shown while the proxy moves the player. <server>
connecting: "<prefix><gray>Sending you to <white><server></white>..."
# A "transfer" action for a client older than 1.20.5, which cannot be transferred. <host>
transfer-not-supported: "<prefix><red>Your Minecraft version cannot switch servers this way. Join <white><host></white> directly."
