# Builds both jars and runs every test, the database tests included, on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # The database tests (LuckPerms, chat log and settings, LiteBans and SkinsRestorer readers) run
      # against a throwaway MariaDB, the same version they were written against.
      mariadb:
        image: mariadb:12.3.2
        env:
          MARIADB_ROOT_PASSWORD: lobbytest
          MARIADB_DATABASE: lobbytest
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      LOBBY_TEST_DB_HOST: 127.0.0.1
      LOBBY_TEST_DB_PORT: 3306
      LOBBY_TEST_DB_USER: root
      LOBBY_TEST_DB_PASSWORD: lobbytest
      LOBBY_TEST_DB_NAME: lobbytest
      # A skipped database test fails the build here (see build.gradle.kts).
      LOBBY_REQUIRE_DB_TESTS: 1
    steps:
      - uses: actions/checkout@v4
        with:
          # The LuckPerms Minestom port is built from the submodule in third_party/luckperms.
          submodules: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: lobby-jars
          path: |
            lobby-server/build/libs/lobby-server.jar
            lobby-bridge-velocity/build/libs/lobby-bridge.jar
