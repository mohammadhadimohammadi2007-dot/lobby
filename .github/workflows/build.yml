# Builds both jars and runs the tests on every push and pull request.
name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build
      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: lobby-jars
          path: |
            lobby-server/build/libs/lobby-server.jar
            lobby-bridge-velocity/build/libs/lobby-bridge.jar
