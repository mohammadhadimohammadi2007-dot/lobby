# All dependency versions live here. Update a version once and every module picks it up.

[versions]
minestom = "2026.10.05-26.2"
polar = "1.16.0"
adventure = "5.2.0"
configurate = "4.2.0"
slf4j = "2.0.20"
logback = "1.6.5"
hikaricp = "7.1.0"
mariadb = "3.5.10"
gson = "2.14.0"
velocity = "4.2.0"
viaversion = "5.12.0"
junit = "6.1.3"
shadow = "9.6.1"

[libraries]
minestom = { module = "net.minestom:minestom", version.ref = "minestom" }
polar = { module = "dev.hollowcube:polar", version.ref = "polar" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version.ref = "configurate" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
hikaricp = { module = "com.zaxxer:HikariCP", version.ref = "hikaricp" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version.ref = "mariadb" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
velocity-api = { module = "com.velocitypowered:velocity-api", version.ref = "velocity" }
viaversion-api = { module = "com.viaversion:viaversion-api", version.ref = "viaversion" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
