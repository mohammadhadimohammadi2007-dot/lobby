# The options to change in the lobby's config.yml (here for lobby-1 of ../velocity/velocity.toml).
# Everything else can stay as the lobby wrote it on its first start.

server:
  # Unique per lobby: the same name as in velocity.toml [servers]. Shown in %server_name%.
  name: "lobby-1"
  # Only the proxy connects. 127.0.0.1 if the proxy is on the same machine; otherwise 0.0.0.0 and a
  # firewall that only lets the proxy in (firewall.md).
  host: "127.0.0.1"
  port: 25566
  max-players: 200

mode: velocity
# The text inside forwarding.secret next to velocity.toml. Never share it.
velocity-secret: "paste-the-forwarding-secret-here"

ops:
  protection: code-and-ip
  # true only if velocity.toml has online-mode = false.
  protect-behind-proxy: false
